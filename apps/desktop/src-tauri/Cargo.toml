[package]
name = "vodscribe"
description = "Searchable transcripts for Kick, Twitch, YouTube and other VODs"
# The .deb and .rpm list this as the maintainer.
authors = ["Airodonack"]
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise conflicts on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "vodscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The end-to-end tests' way into the page where there's no WebDriver (src/e2e.rs).
# Test builds only: never in a release.
e2e = ["vodscribe-player/counts"]
# A site's VOD's picture taken from its player into the app's own, under it
# (embed_shim.js, embed.rs, embed.ts bridge). Off in releases: YouTube's and
# Twitch's developer terms forbid playing their video through another player.
embed-takeover = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vodscribe-core = { path = "../../../crates/core" }
vodscribe-player = { path = "../../../crates/player" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
getrandom = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# What a drag dropped on the window offers, its virtual files, file
# promises and files saved for it read out of it (drop_target, receive.rs).
dragndrop-target = { path = "../../../crates/dragndrop-target" }
# Dragging a clip out of the window into another app before it's made: the
# drag's data, the receivers' asks and how it ended (drag_source, which
# starts each system's drag).
dragndrop-source = { path = "../../../crates/dragndrop-source" }

[dev-dependencies]
# The commands run on Tauri's mock runtime in the tests (src/testkit.rs).
tauri = { version = "2", features = ["test"] }
# The fakes the tests stand in for programs and the network with.
vodscribe-core = { path = "../../../crates/core", features = ["testkit"] }

# macOS: the app starts the drag itself (drag_source), and takes drops
# (drop_target).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSOperation", "NSProcessInfo", "NSProgress", "NSString", "NSURL", "NSValue", "block2"] }
objc2-app-kit = { version = "0.3", features = ["block2", "libc", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSFilePromiseReceiver", "NSGraphics", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }

# On Windows the app starts the OLE drag itself (drag_source) and takes drops
# (drop_target); the windows crate's version tauri and wry build.
[target.'cfg(windows)'.dependencies]
# (`#[implement]` names windows-core.)
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# The drag's picture decoded here (drag_source).
png = "0.18"
# The web view's own drops turned off, so the app's drop target takes them
# (receive.rs); the version tauri and wry build.
webview2-com = "0.39"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
# The drag's picture decoded here, not by gdk-pixbuf, whose loaders a system
# may run in a sandbox that isn't there (clips.rs drag_picture).
png = "0.18"
