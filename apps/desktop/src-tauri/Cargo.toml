[package]
name = "vodscribe"
description = "Searchable transcripts for Kick, Twitch, YouTube and other VODs"
# The .deb and .rpm list this as the maintainer.
authors = ["Airodonack"]
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise conflicts on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "vodscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["webkit"]
# The page in each system's own web view (WebKitGTK, WebView2, WKWebView),
# through Tauri's wry runtime: what releases ship.
webkit = ["tauri/wry"]
# The page in Servo instead, through tauri-runtime-servo: Linux on X11 only,
# for now. Built without the default features (`--no-default-features
# --features servo`), so neither engine's crates come with the other's.
servo = ["dep:tauri-runtime-servo", "dep:env_logger"]
# The end-to-end tests' way into the page where there's no WebDriver (src/e2e.rs),
# and under Servo its WebDriver server (TAURI_RUNTIME_SERVO_WEBDRIVER_PORT).
# Test builds only: never in a release.
e2e = ["vodscribe-player/counts", "tauri-runtime-servo?/webdriver"]
# A site's VOD's picture taken from its player into the app's own, under it
# (embed_shim.js, embed.rs, embed.ts bridge). Off in releases: YouTube's and
# Twitch's developer terms forbid playing their video through another player.
embed-takeover = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vodscribe-core = { path = "../../../crates/core" }
vodscribe-player = { path = "../../../crates/player" }
# Tauri's default features but its wry runtime, which comes with `webkit`.
tauri = { version = "2", default-features = false, features = [
  "compression",
  "common-controls-v6",
  "dynamic-acl",
  "x11",
  "dbus",
] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
getrandom = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# Dragging a clip out of the window into another app (clips.rs): the app
# starts each OS's drag itself, the GTK one on Linux.

# macOS: the app starts the drag itself (file_drag), with a file promise (the
# file written where it's dropped once it's made) beside the file's address.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSOperation", "NSProcessInfo", "NSProgress", "NSString", "NSURL", "NSValue", "block2"] }
objc2-app-kit = { version = "0.3", features = ["block2", "libc", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }

# On Windows the app starts the OLE drag itself (drag_source), offering a clip
# before its file is made; the windows crate's version tauri and wry build.
[target.'cfg(windows)'.dependencies]
# (`#[implement]` names windows-core.)
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# The drag's picture decoded here (drag_source).
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
# The drag's picture decoded here, not by gdk-pixbuf, whose loaders a system
# may run in a sandbox that isn't there (clips.rs drag_picture).
png = "0.18"
# The Servo runtime (the `servo` feature). A path for now: the repository has
# no published home yet.
tauri-runtime-servo = { path = "/mnt/data/vodscribe/cache/servo/repo/tauri-servo/tauri-runtime-servo", optional = true }
# Servo and its runtime report through `log`, the page's console among them
# (the `console` target); the wry runtime's web views have an inspector instead.
env_logger = { version = "0.11", optional = true }
