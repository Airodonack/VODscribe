[package]
name = "vodscribe"
description = "Searchable transcripts for Kick, Twitch, YouTube and other VODs"
# The .deb and .rpm list this as the maintainer.
authors = ["Airodonack"]
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise conflicts on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "vodscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The end-to-end tests' way into the page where there's no WebDriver (src/e2e.rs).
# Test builds only: never in a release.
e2e = ["vodscribe-player/counts"]
# A site's VOD's picture taken from its player into the app's own, under it
# (embed_shim.js, embed.rs, embed.ts bridge). Off in releases: YouTube's and
# Twitch's developer terms forbid playing their video through another player.
embed-takeover = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vodscribe-core = { path = "../../../crates/core" }
vodscribe-player = { path = "../../../crates/player" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
getrandom = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# Dragging a clip out of the window into another app (clips.rs). On Linux the
# app starts the GTK drag itself: drag's builds an unescaped file:// URI, which
# breaks on names with spaces.
[target.'cfg(windows)'.dependencies]
drag = "2.1"

# macOS: the app starts the drag itself (file_drag), with a file promise (the
# file written where it's dropped once it's made) beside the file's address.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSOperation", "NSProgress", "NSString", "NSURL", "NSValue", "block2"] }
objc2-app-kit = { version = "0.3", features = ["block2", "libc", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
# The drag's picture decoded here, not by gdk-pixbuf, whose loaders a system
# may run in a sandbox that isn't there (clips.rs drag_picture).
png = "0.18"
