name: Build installers

# Runs on every push to main that touches the app, so a commit that breaks a
# platform's build shows up within the hour instead of at release; on a v*
# tag; and by hand. Main's runs also keep the Rust cache warm for tag runs,
# which can only restore caches saved on the default branch.
#
# A v* tag also publishes the release (the publish and winget jobs). Secrets:
#   TAURI_SIGNING_PRIVATE_KEY   signs update bundles (~/.tauri/vodscribe-updater.key);
#                               in the `release` environment, so only v* tags get it
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#                               an R2 API token that can write the vodscribe bucket
#   WINGET_TOKEN                optional: a GitHub token of the Airodonack account,
#                               to submit the new version to winget-pkgs
# Variables:
#   WINGET_SUBMIT               optional: false skips the winget job
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # The website and notes don't change the app. (Tag pushes ignore this.)
    paths-ignore: ["apps/site/**", "**/*.md"]

permissions:
  contents: read

# A new run for the same ref replaces one in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 90
    # The update signing key lives in the `release` environment, which only v*
    # tags may use. Other runs (by hand) build without it and skip the signed
    # update bundles.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs, built on Intel runners: a separate pool from the Apple
          # Silicon ones, which at times can't take a job at all.
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Map the runner's paths out of panic messages and debug info in the binaries.
      # RUSTFLAGS replaces .cargo/config.toml's target flags, so repeat crt-static.
      - name: Remap build paths
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          home="$HOME" work="$PWD"
          if [[ "$RUNNER_OS" == Windows ]]; then home=$(cygpath -w "$HOME") work=$(cygpath -w "$PWD"); fi
          flags="--remap-path-prefix=$home=~ --remap-path-prefix=$work=."
          if [[ "$TARGET" == *windows* ]]; then flags="$flags -C target-feature=+crt-static"; fi
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # The same checks as .githooks/pre-commit; cheap, so they fail a release early.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          pnpm lint

      - name: Build transcription workers
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: scripts/prepare-sidecars.sh release

      - name: Build app and installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          # Signed update bundles need the updater key, so they're only made where it's set.
          args=()
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            args=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          # Between releases main's version is the next one in development
          # (0.4.1-dev), which an MSI can't have (numbers only): its numbers.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$version" == *-* ]]; then
            args+=(--config "{\"bundle\":{\"windows\":{\"wix\":{\"version\":\"${version%%-*}\"}}}}")
          fi
          pnpm --filter desktop tauri build --target ${{ matrix.target }} "${args[@]}"

      # The end-to-end tests' way into the page (the `e2e` feature, src/e2e.rs)
      # runs any script in the app for whoever has its token: never in a release.
      - name: Check the app has no test hook
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/vodscribe
          [[ -f "$bin" ]] || bin="$bin.exe"
          # Not there would pass the check below (grep can't read it): fail instead.
          [[ -f "$bin" ]] || { echo "no app at $bin to check"; exit 1; }
          if grep -qa VODSCRIBE_E2E_TOKEN "$bin"; then echo "$bin was built with the e2e feature"; exit 1; fi

      # No one has a Mac to try the app on, so check what can be checked here:
      # the bundle's signature covers everything in it, it asks for macOS 12,
      # and both programs in it start on this chip.
      - name: Check the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls -d target/${{ matrix.target }}/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = 12.0
          # Ad-hoc signed: Gatekeeper rejects it (users approve it once); shown for the log.
          spctl --assess --verbose=4 "$app" || true
          # Without arguments the worker exits asking for them: it loaded and ran.
          if out=$("$app/Contents/MacOS/vodscribe-worker" 2>&1); then exit 1; fi
          grep -q -- "--model is required" <<<"$out" || { echo "$out"; exit 1; }
          file "$app/Contents/MacOS/"*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vodscribe-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 14

      # On Windows the app again, with the end-to-end tests' hook (the `e2e`
      # feature), for e2e.yml to drive: a release doesn't let WebDriver in
      # (lib.rs webview_args). Made after the release is checked and kept,
      # under a name the release never takes files from.
      - name: Build the app for the end-to-end tests
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm --filter desktop tauri build --target ${{ matrix.target }} --features e2e --no-bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: e2e-app-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vodscribe.exe
          if-no-files-found: error
          retention-days: 14

  # Installs each Linux and Windows build and drives it end to end (e2e.yml).
  e2e:
    needs: build
    # What e2e.yml asks for: it can't have more than its caller grants.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/e2e.yml

  # Uploads a tagged release to dl.vodscribe.com (R2): each file under
  # releases/<version>/, the installers again under releases/latest/ for the
  # website, and latest.json last, so the app only hears of an update once
  # every file is in place.
  publish:
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take the checksums newer AWS CLIs add by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installers only (vodscribe-<target>), never the tests' builds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: vodscribe-*

      - name: Check the tag matches the app's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare the release
        run: python3 scripts/release.py artifacts "$VERSION" release

      - name: Upload to R2
        run: |
          s3() { aws s3 "$@" --endpoint-url "$R2" --only-show-errors; }
          # Versioned files never change; latest/ and latest.json are replaced each release.
          s3 cp release/files "s3://vodscribe/releases/$VERSION/" --recursive \
            --cache-control "public, max-age=31536000, immutable"
          # latest/ keeps the stable names the website links to, but each download
          # is saved under its versioned name (the Content-Disposition).
          while read -r name named; do
            s3 cp "release/latest/$name" "s3://vodscribe/releases/latest/$name" --cache-control "public, max-age=300" \
              --content-disposition "attachment; filename=\"$named\""
          done < release/latest.txt
          s3 cp release/latest.json s3://vodscribe/releases/latest.json --content-type application/json \
            --cache-control "public, max-age=300"

      # From the outside, as the app and the website see it: latest.json, every
      # update file's signature, and the website's downloads (scripts/verify-release.py).
      - name: Check the published release
        run: python3 -I scripts/verify-release.py "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: release/winget
          if-no-files-found: error

  # Submits the new version to winget-pkgs as a pull request from the
  # Airodonack account, once that account's token is set.
  winget:
    needs: publish
    # Can be turned off (the WINGET_SUBMIT variable) while a version waits for
    # winget's first review: a new PR would supersede it and start that review over.
    if: vars.WINGET_SUBMIT != 'false'
    timeout-minutes: 15
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: winget

      - name: Submit to winget-pkgs
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Output "No WINGET_TOKEN; skipping."; exit 0 }
          # wingetcreate v1.12.13.0, pinned by SHA-256.
          $exe = "$env:RUNNER_TEMP\wingetcreate.exe"
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA") { throw "wingetcreate.exe doesn't match its SHA-256" }
          & $exe submit --token $env:WINGET_TOKEN winget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
