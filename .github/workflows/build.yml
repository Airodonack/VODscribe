name: Build installers

# Runs by hand or on a v* tag. Tag runs can only restore caches saved on the
# default branch, so run it by hand on main now and then to keep the Rust cache warm.
#
# A v* tag also publishes the release (the publish and winget jobs). Secrets:
#   TAURI_SIGNING_PRIVATE_KEY   signs update bundles (~/.tauri/vodscribe-updater.key);
#                               in the `release` environment, so only v* tags get it
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#                               an R2 API token that can write the vodscribe bucket
#   WINGET_TOKEN                optional: a GitHub token of the Airodonack account,
#                               to submit the new version to winget-pkgs
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A new run for the same ref replaces one in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 90
    # The update signing key lives in the `release` environment, which only v*
    # tags may use. Other runs (by hand) build without it and skip the signed
    # update bundles.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs, cross-compiled on Apple Silicon runners.
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Map the runner's paths out of panic messages and debug info in the binaries.
      # RUSTFLAGS replaces .cargo/config.toml's target flags, so repeat crt-static.
      - name: Remap build paths
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          home="$HOME" work="$PWD"
          if [[ "$RUNNER_OS" == Windows ]]; then home=$(cygpath -w "$HOME") work=$(cygpath -w "$PWD"); fi
          flags="--remap-path-prefix=$home=~ --remap-path-prefix=$work=."
          if [[ "$TARGET" == *windows* ]]; then flags="$flags -C target-feature=+crt-static"; fi
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # The same checks as .githooks/pre-commit; cheap, so they fail a release early.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          pnpm lint

      - name: Build transcription workers
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: scripts/prepare-sidecars.sh release

      - name: Build app and installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          # Signed update bundles need the updater key, so they're only made where it's set.
          args=()
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            args=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm --filter desktop tauri build --target ${{ matrix.target }} "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vodscribe-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 14

  # Uploads a tagged release to dl.vodscribe.com (R2): each file under
  # releases/<version>/, the installers again under releases/latest/ for the
  # website, and latest.json last, so the app only hears of an update once
  # every file is in place.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take the checksums newer AWS CLIs add by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag's message becomes the release notes.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Check the tag matches the app's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare the release
        run: |
          # checkout can leave a lightweight copy of an annotated tag; its message is the notes.
          git fetch --force origin "$GITHUB_REF:$GITHUB_REF"
          python3 scripts/release.py artifacts "$VERSION" release

      - name: Upload to R2
        run: |
          s3() { aws s3 "$@" --endpoint-url "$R2" --only-show-errors; }
          # Versioned files never change; latest/ and latest.json are replaced each release.
          s3 cp release/files "s3://vodscribe/releases/$VERSION/" --recursive \
            --cache-control "public, max-age=31536000, immutable"
          s3 cp release/files s3://vodscribe/releases/latest/ --recursive --exclude "*.app.tar.gz" \
            --cache-control "public, max-age=300"
          s3 cp release/latest.json s3://vodscribe/releases/latest.json --content-type application/json \
            --cache-control "public, max-age=300"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: release/winget
          if-no-files-found: error

  # Submits the new version to winget-pkgs as a pull request from the
  # Airodonack account, once that account's token is set.
  winget:
    needs: publish
    timeout-minutes: 15
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: winget

      - name: Submit to winget-pkgs
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Output "No WINGET_TOKEN; skipping."; exit 0 }
          # wingetcreate v1.12.13.0, pinned by SHA-256.
          $exe = "$env:RUNNER_TEMP\wingetcreate.exe"
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA") { throw "wingetcreate.exe doesn't match its SHA-256" }
          & $exe submit --token $env:WINGET_TOKEN winget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
