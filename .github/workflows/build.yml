name: Build installers

# Runs by hand or on a v* tag. Tag runs can only restore caches saved on the
# default branch, so run it by hand on main now and then to keep the Rust cache warm.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A new run for the same ref replaces one in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs, cross-compiled on Apple Silicon runners.
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Map the runner's paths out of panic messages and debug info in the binaries.
      # RUSTFLAGS replaces .cargo/config.toml's target flags, so repeat crt-static.
      - name: Remap build paths
        shell: bash
        run: |
          home="$HOME" work="$PWD"
          if [[ "$RUNNER_OS" == Windows ]]; then home=$(cygpath -w "$HOME") work=$(cygpath -w "$PWD"); fi
          flags="--remap-path-prefix=$home=~ --remap-path-prefix=$work=."
          if [[ "${{ matrix.target }}" == *windows* ]]; then flags="$flags -C target-feature=+crt-static"; fi
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # The same checks as .githooks/pre-commit; cheap, so they fail a release early.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          pnpm lint

      - name: Build transcription workers
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: scripts/prepare-sidecars.sh release

      - name: Build app and installers
        run: pnpm --filter desktop tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vodscribe-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 14
