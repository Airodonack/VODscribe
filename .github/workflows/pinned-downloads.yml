name: Pinned downloads

# Weekly: are the files setup, the GPU add-on and the sidecar build download
# still where they're pinned? A vanished ffmpeg or Deno build breaks setup for
# every new user without any other signal. A failed run emails the repo owner.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I scripts/check-pinned-downloads.py
