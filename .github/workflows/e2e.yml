name: End-to-end tests

# Installs the Linux and Windows builds and drives them (tests/e2e/run.mjs):
# on Linux the installed app over WebDriver; on Windows the installed app
# with the build made for the tests (build.yml) put over its vodscribe.exe,
# through the app's own test hook; on macOS (Apple silicon) that build's .app,
# the same way. A hosted Mac grants no Screen Recording or Accessibility, so
# the OS-level scenarios skip there, and it may have no sound output (the
# preflight says).
# build.yml calls it after each build. By hand, it tests an earlier "Build
# installers" run's installers (the run id is in its URL), so a change to the
# test can be tried without building again.
#
# The suite is split into shards (run.mjs --shard i/N, dealt by the seconds
# each scenario took, tests/e2e/durations.json), one job each, so a lane takes
# as long as its slowest shard: 2 on Ubuntu and Windows, 3 on macOS, whose
# runners are the slowest. The fast lane runs the Ubuntu shards only; the full
# lane all of them. Each shard uploads its out folder (e2e-<target>-<i>), and
# the last job merges their results.json into one summary and fails if a
# scenario did, or if a shard never reported.
on:
  workflow_call:
    inputs:
      lane:
        description: fast (the Ubuntu shards) or full (every system's)
        type: string
        default: full
      build_run:
        description: The id of a Build installers run whose installers to test
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      lane:
        description: Which shards to run
        type: choice
        options: [full, fast]
        default: full
      build_run:
        description: The id of a Build installers run whose installers to test
        required: true

permissions:
  contents: read
  actions: read

jobs:
  # The shards to run: every system's in the full lane, the Ubuntu ones in the
  # fast. The matrix is made here because a job's own `if` can't see it.
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          all=$(cat <<'JSON'
          [
            {"os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "models": "~/.local/share/app.vodscribe/models", "shard": "1/2", "index": 1},
            {"os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "models": "~/.local/share/app.vodscribe/models", "shard": "2/2", "index": 2},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "models": "~\\AppData\\Local\\app.vodscribe\\models", "shard": "1/2", "index": 1},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "models": "~\\AppData\\Local\\app.vodscribe\\models", "shard": "2/2", "index": 2},
            {"os": "macos-latest", "target": "aarch64-apple-darwin", "models": "~/Library/Application Support/app.vodscribe/models", "shard": "1/3", "index": 1},
            {"os": "macos-latest", "target": "aarch64-apple-darwin", "models": "~/Library/Application Support/app.vodscribe/models", "shard": "2/3", "index": 2},
            {"os": "macos-latest", "target": "aarch64-apple-darwin", "models": "~/Library/Application Support/app.vodscribe/models", "shard": "3/3", "index": 3}
          ]
          JSON
          )
          case "$LANE" in
            full) ;;
            fast) all=$(jq -c 'map(select(.os == "ubuntu-22.04"))' <<<"$all") ;;
            *) echo "lane must be full or fast, not '$LANE'"; exit 1 ;;
          esac
          echo "matrix=$(jq -c '{include: .}' <<<"$all")" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq length <<<"$all")" >> "$GITHUB_OUTPUT"

  e2e:
    needs: plan
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # By hand: only a build of this repository's main or a release tag. A
      # fork's pull request can't run build.yml, but could upload artifacts
      # of the same names from another workflow, to be installed here.
      - name: Check the build run
        if: inputs.build_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.build_run }}
        run: |
          set -euo pipefail
          # A run id is a number; anything else could reach another API path.
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "build_run must be a run's number, not '$RUN'"; exit 1; }
          read -r path repo event branch < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" \
            --jq '[.path, .head_repository.full_name, .event, .head_branch] | @tsv')
          echo "run $RUN: $path from $repo ($event, $branch)"
          [[ "$path" == .github/workflows/build.yml && "$repo" == "$GITHUB_REPOSITORY" ]]
          [[ "$event" == push || "$event" == workflow_dispatch || "$event" == schedule ]]
          [[ "$branch" == main || "$branch" == v* ]]

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vodscribe-${{ matrix.target }}
          path: build
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}

      # Windows and macOS: the app with the tests' hook, to drive in place of
      # the installed one (a release doesn't let WebDriver in; macOS has none).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os != 'Linux'
        with:
          name: e2e-app-${{ matrix.target }}
          path: e2e-app
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}

      # The speech model (about 1 GB) between runs; on a miss, setup downloads it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.models }}
          key: e2e-model-${{ runner.os }}-${{ hashFiles('crates/core/src/model.rs') }}

      - name: Install the app and the WebDriver tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            cargo install tauri-driver --version 2.1.0 --locked
            sudo apt-get update
            sudo apt-get install -y webkit2gtk-driver xvfb xdotool openbox ./build/deb/*.deb
            echo "APP=/usr/bin/vodscribe" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            # The app with the tests' hook, as built (a runner has no Mac's
            # quarantine to clear: nothing here was downloaded by a browser).
            tar -xzf e2e-app/app.tar.gz -C "$RUNNER_TEMP"
            echo "APP=$RUNNER_TEMP/VODscribe.app" >> "$GITHUB_ENV"
          else
            # The installer, silently, for this user (its usual mode).
            setup=(./build/nsis/*-setup.exe)
            "${setup[0]}" //S
            app=$(find "$LOCALAPPDATA/VODscribe" -maxdepth 1 -iname 'vodscribe.exe' | head -1)
            test -n "$app"
            # The test build in its place, with everything else as installed.
            cp -f e2e-app/vodscribe.exe "$app"
            echo "APP=$(cygpath -w "$app")" >> "$GITHUB_ENV"
          fi

      - name: Drive the app
        shell: bash
        env:
          # No update check (latest.json): test runs aren't people using the app.
          VODSCRIBE_NO_UPDATE_CHECK: "1"
          # Each scenario starts on an empty library (tests/e2e/lib/data.mjs).
          E2E_RESET_DATA: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Under a window manager, as on a desktop: full screen is the window manager's to do.
            # On a screen the window fits on (xvfb-run's own is 640x480), for the OS-level drags.
            # (The inner shell expands $1 and $2, the app's path and the shard.)
            # shellcheck disable=SC2016
            dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" \
              sh -c 'openbox & sleep 1; exec node tests/e2e/run.mjs "$1" --shard "$2"' sh "$APP" "$SHARD"
          else
            node tests/e2e/run.mjs "$APP" --driver bridge --shard "$SHARD"
          fi

      # Always, not only on a failure: the summary job reads every shard's
      # results.json from here. The artifact is the shard's whole out folder.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ matrix.target }}-${{ matrix.index }}
          path: tests/e2e/out
          if-no-files-found: ignore
          retention-days: 14

  # One summary of all the shards (tests/e2e/merge-results.mjs). It fails when
  # a scenario did, and when a shard left no results.json (it crashed, or was
  # cancelled) so a missing shard can't pass for a green one.
  summary:
    needs: [plan, e2e]
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Only the shards' artifacts (e2e-<target>-<n>), not the builds' e2e-app-*.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*-[0-9]
          path: e2e-results

      - name: Merge the shards' results
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: node tests/e2e/merge-results.mjs --expect "$SHARDS" e2e-results

      # Not run yet: it needs OPENROUTER_API_KEY as a repository secret, and
      # costs money per run. To turn it on, uncomment it; it judges the
      # checkpoints of every shard that reported, and fails on a `fail`. Full
      # lane only (the fast lane's checkpoints are the Ubuntu shards' alone).
      # - name: Judge the checkpoints
      #   if: ${{ !cancelled() && inputs.lane == 'full' }}
      #   env:
      #     OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      #   run: node tests/e2e/verify.mjs e2e-results/*/
