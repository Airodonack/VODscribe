name: Check formatting

# The same checks as .githooks/pre-commit, on every push and pull request.
# Formatting needs no build, so this takes well under a minute.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref replaces a check in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.99.0"
          components: rustfmt

      - run: cargo fmt --all --check

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop lint
