name: Checks

# On every push and pull request: the workflows themselves (actionlint, which
# also runs shellcheck on their scripts), formatting (the same check as
# .githooks/pre-commit), type checks and the website build, the third-party
# notices, the core's lints and tests, and the player's.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref replaces a check in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint v1.7.12, pinned by SHA-256.
      - name: Lint workflows
        run: |
          tarball=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$tarball"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tarball" | sha256sum -c -
          tar xzf "$tarball" actionlint
          ./actionlint -color

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.99.0"
          components: rustfmt

      - run: cargo fmt --all --check
      # The version being worked on has a CHANGELOG.md entry, and the parsing works.
      - run: python3 -I scripts/release.py --check
      - run: python3 -I scripts/test_release.py

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      # Our copy of Tauri's installer template still matches the CLI in use.
      - run: python3 -I scripts/check-nsis-template.py
      # The demo's search against the cases the Rust search is tested with, and a VOD page's files.
      - run: node --test apps/site/src/lib/tauri/search.test.mjs apps/site/src/lib/tauri/query.test.mjs apps/site/src/lib/tauri/annotated.test.mjs apps/site/src/lib/changelog.test.mjs apps/site/src/lib/verdicts.test.mjs
      - run: node --test apps/desktop/src/lib/events.test.mjs apps/desktop/src/lib/rows.test.mjs apps/desktop/src/lib/stretches.test.mjs apps/desktop/src/lib/follow.test.mjs apps/desktop/src/lib/transcriptGroups.test.mjs apps/desktop/src/lib/chatParts.test.mjs apps/desktop/src/lib/theme.test.mjs apps/desktop/src/lib/modules.test.mjs apps/desktop/src/lib/media.test.mjs apps/desktop/src/lib/scrubFrame.test.mjs apps/desktop/src/lib/platform.test.mjs apps/desktop/colorMix.test.mjs apps/desktop/src/lib/playerClock.test.mjs apps/desktop/src/lib/ownStatus.test.mjs apps/desktop/src/lib/settle.test.mjs apps/desktop/src/lib/playerKeys.test.mjs apps/desktop/src/lib/keymap.test.mjs apps/desktop/src/lib/queryChips.test.mjs apps/desktop/src-tauri/src/embed_shim.test.mjs apps/desktop/src/lib/nativeDriver.test.mjs apps/desktop/src/lib/annotated.test.mjs apps/desktop/src/lib/castNames.test.mjs apps/desktop/src/lib/annotationRows.test.mjs apps/desktop/src/lib/markSources.test.mjs apps/desktop/src/lib/pinned.test.mjs apps/desktop/src/lib/povs.test.mjs apps/desktop/src/lib/pick.test.mjs apps/desktop/src/lib/kept.test.mjs apps/desktop/src/lib/resting.test.mjs apps/desktop/src/lib/pressToDrag.test.mjs apps/desktop/src/lib/latest.test.mjs apps/desktop/src/lib/fanout.test.mjs apps/desktop/src/lib/dragout.test.mjs apps/desktop/src/lib/textWrap.test.mjs
      # verify.mjs turns checkpoints into JPEGs with ffmpeg, and its tests
      # make their pictures with it; Ubuntu's 4.4 does both.
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The end-to-end harness's own parts.
      - run: node --test tests/e2e/verify.test.mjs
      - run: node --test tests/e2e/durations.test.mjs tests/e2e/merge-results.test.mjs tests/e2e/lib/budgets.test.mjs tests/e2e/lib/drivers.test.mjs tests/e2e/lib/fileHost.test.mjs tests/e2e/lib/data.test.mjs tests/e2e/lib/dump.test.mjs
      # Also catches app code the website's demo stand-ins don't provide.
      - run: pnpm --filter site build

      # cargo-about v0.9.2, pinned by SHA-256. Fails on a dependency whose license
      # isn't accepted in licenses/about.toml, or a notices file left out of date.
      - name: Check third-party notices
        run: |
          tarball=cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$tarball"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $tarball" | sha256sum -c -
          tar xzf "$tarball"
          cargo fetch --locked
          CARGO_ABOUT="$PWD/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" python3 scripts/third-party-notices.py --check

  # The core's tests and lints. The desktop app and the worker need system
  # libraries and sherpa-onnx, so the release build (build.yml) covers those.
  rust:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.99.0"
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo clippy --locked -p vodscribe-core --all-targets -- -D warnings
      - run: cargo test --locked -p vodscribe-core

  # The player's lints and tests: its compositor on lavapipe (Mesa's software
  # Vulkan; tests ask for a software adapter and fail here without one), its
  # frame checks with the ffmpeg the app ships (Ubuntu's 4.4 is too old).
  player:
    timeout-minutes: 25
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.99.0"
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libasound2-dev mesa-vulkan-drivers libvulkan1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ hashFiles('crates/core/src/deps.rs') }}

      - name: FFmpeg
        run: |
          python3 -I scripts/fetch-ffmpeg.py ~/ffmpeg
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - run: cargo clippy --locked -p vodscribe-player --all-targets -- -D warnings
      - run: cargo test --locked -p vodscribe-player
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VODSCRIBE_TESTS_NEED_ALL: "1"
