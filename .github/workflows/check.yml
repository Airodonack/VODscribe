name: Check formatting

# The same checks as .githooks/pre-commit, on every push and pull request.
# Formatting needs no build, so this takes well under a minute.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref replaces a check in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: "1.99.0"
          components: rustfmt

      - run: cargo fmt --all --check

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
