name: Bug report
description: Something in VODscribe doesn't work as it should.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: VODscribe version
      description: It's beside the name at the top of the library.
      placeholder: "0.7.2"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you did
      placeholder: "1. Opened a Twitch VOD\n2. Pressed Play"
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or log
      description: Optional. Drop a picture or a file here.
