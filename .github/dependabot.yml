# Monthly update PRs, one per ecosystem, so dependency security fixes aren't missed.
version: 2
updates:
  # The commit-pinned GitHub Actions in build.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Cargo workspace (crates/* and apps/desktop/src-tauri).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Pinned exactly: scripts/prepare-sidecars.sh verifies this version's
      # prebuilt libraries, so it's bumped by hand with new hashes.
      - dependency-name: sherpa-onnx
      - dependency-name: sherpa-onnx-sys
      # Must be the glib that gtk 0.18 (Tauri's) is built on: the drag's
      # nested main loop and the player's windows hand glib types to gtk, and
      # a second glib's types aren't gtk's. Moves with gtk, bumped by hand.
      - dependency-name: glib
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Held at 0.40 (SQLite 3.51): 0.41 bundles SQLite 3.54, whose planner put
      # the library's perf check over budget. Bumped by hand once the slow
      # query is understood and rewritten.
      - dependency-name: rusqlite
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The pnpm workspace (apps/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # SvelteKit reads tsconfig through TypeScript's JavaScript API, which the
      # native TypeScript 7 doesn't have; revisit when SvelteKit supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Matches the Node version in .nvmrc (24); bump together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
