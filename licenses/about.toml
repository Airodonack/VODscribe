# cargo-about: the licenses VODscribe's Rust dependencies may use. A dependency
# under any other license (a GPL one, say) fails `scripts/third-party-notices.sh`
# and with it CI, until someone decides whether it's acceptable.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# VODscribe's own crates (publish = false) aren't third-party.
private = { ignore = true }
# Every target the app ships for, so one file covers every installer.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
