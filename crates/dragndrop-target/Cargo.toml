[package]
name = "dragndrop-target"
version = "0.1.0"
description = "Read what a drag dropped on your window offers: plain paths, and virtual files with no path yet"
authors = ["Airodonack"]
license = "MIT OR Apache-2.0"
edition = "2024"
# No newer than wry's.
rust-version = "1.85"
keywords = ["drag-and-drop", "drop", "virtual-file", "file-promise"]
categories = ["gui", "os"]
# Published once its API settles.
publish = false

# The objc2 crates' versions as wry builds them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSOperation",
  "NSPathUtilities",
  "NSString",
  "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSDragging",
  "NSFilePromiseReceiver",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSWorkspace",
] }

# The windows crate's version and features as wry builds them.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }

# GTK 3 as wry builds it; gdk, gio and glib through it.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
