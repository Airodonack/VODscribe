[package]
name = "dragndrop-source"
version = "0.1.0"
description = "Drag files out of your window before they exist: virtual files and file promises, each made after the drop"
authors = ["Airodonack"]
license = "MIT OR Apache-2.0"
edition = "2024"
# No newer than wry's.
rust-version = "1.85"
keywords = ["drag-and-drop", "drag", "virtual-file", "file-promise"]
categories = ["gui", "os"]
# Published once its API settles.
publish = false

# The objc2 crates' versions as wry builds them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSGeometry",
  "NSOperation",
  "NSProgress",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "libc",
  "NSApplication",
  "NSDragging",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSEvent",
  "NSFilePromiseProvider",
  "NSGraphics",
  "NSImage",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSRunningApplication",
  "NSWindow",
] }

# The windows crate's version as wry builds it (`#[implement]` names
# windows-core). Gdi for STGMEDIUM and IDataObject, which name a bitmap.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# GTK 3 as wry builds it; gdk, gio and glib through it.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
