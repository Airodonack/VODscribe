[package]
name = "vodscribe-player"
description = "The app's own video player: decoding, timing and drawing done here, not by the webview"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "vodscribe-play"
path = "src/bin/play.rs"

[dependencies]
anyhow = "1"
cpal = "0.18.2"
serde = { version = "1", features = ["derive"] }
vodscribe-core = { path = "../core" }

# Linux draws into a GL area in the window's GTK widget tree, under the page.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
gl = "0.14"
libloading = "0.8"

[target."cfg(windows)".dependencies]
pollster = "1.0.1"
raw-window-handle = "0.6.2"
wgpu = "30.0.1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
