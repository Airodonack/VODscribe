[package]
name = "vodscribe-player"
description = "The app's own video player: decoding, timing and drawing done here, not by the webview"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "vodscribe-play"
path = "src/bin/play.rs"

[features]
# Counts kept for the tests (`decode::video_starts`): its own tests and the
# app's end-to-end build (the desktop crate's `e2e`), never a release.
counts = []

[dependencies]
anyhow = "1"
cpal = "0.18.2"
# The compositor (compose.rs) on every platform; Linux and Windows also paint with it.
pollster = "1.0.1"
raw-window-handle = "0.6.2"
wgpu = "30.0.1"
serde = { version = "1", features = ["derive"] }
vodscribe-core = { path = "../core" }

# Linux draws (through the compositor) on a native surface over the window:
# a Wayland subsurface or a child X window. The libraries are loaded when
# used, so either session works without the other's.
[target.'cfg(target_os = "linux")'.dependencies]
gdkwayland-sys = "0.18.2"
gdkx11-sys = "0.18.2"
glib = "0.18"
gtk = "0.18"
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }
wayland-client = "0.31.15"
wayland-sys = { version = "0.31.11", features = ["client", "dlopen"] }
x11-dl = "2.21.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }

# macOS shows frames as images in a Core Animation layer of its own, over
# the page's view: no Metal needed.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }

# Its own tests read the counts (`counts` above).
[dev-dependencies]
vodscribe-player = { path = ".", features = ["counts"] }
