[workspace]
members = ["crates/core", "crates/player", "crates/worker", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
publish = false

# See https://tauri.app/concept/size/#cargo-configuration
# The player's per-pixel work is far too slow unoptimised: in `tauri dev`
# a 1080p frame took 57 ms to draw and the picture fell half a second
# behind the sound (release: 4 ms). Optimised in dev builds too.
[profile.dev.package.vodscribe-player]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The release build with what a profiler needs to name our code: its
# symbols and line tables (frames by function and line; perf, in
# tests/e2e). Built by scripts/build-profiling.sh, which also turns on frame
# pointers. Never shipped.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# A copy of sherpa-onnx-sys that can link sherpa-onnx's builds without
# text-to-speech (and its GPL-3.0 espeak-ng); see third_party/README.md.
[patch.crates-io]
sherpa-onnx-sys = { path = "third_party/sherpa-onnx-sys" }
