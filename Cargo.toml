[workspace]
members = ["crates/core", "crates/player", "crates/worker", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.7.1"
edition = "2024"
publish = false

# See https://tauri.app/concept/size/#cargo-configuration
# The player's per-pixel work is far too slow unoptimised: in `tauri dev`
# a 1080p frame took 57 ms to draw and the picture fell half a second
# behind the sound (release: 4 ms). Optimised in dev builds too.
[profile.dev.package.vodscribe-player]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The release build with what a profiler needs to name our code: its
# symbols and line tables (frames by function and line; perf, in
# tests/e2e). Built by scripts/build-profiling.sh, which also turns on frame
# pointers. Never shipped.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# A copy of sherpa-onnx-sys that can link sherpa-onnx's builds without
# text-to-speech (and its GPL-3.0 espeak-ng); see third_party/README.md.
[patch.crates-io]
sherpa-onnx-sys = { path = "third_party/sherpa-onnx-sys" }
# Servo's layout reads scrollbar-width, scrollbar-color and scrollbar-gutter,
# which stylo 0.22.0 hides from Servo; the servo runtime's fork of stylo exposes
# them. A [patch] only counts in the root workspace, so it is repeated here,
# for every crate of stylo's workspace (or two copies of the shared ones build).
selectors = { path = "/mnt/data/servo-spike/stylo/selectors" }
servo_arc = { path = "/mnt/data/servo-spike/stylo/servo_arc" }
stylo = { path = "/mnt/data/servo-spike/stylo/style" }
stylo_atoms = { path = "/mnt/data/servo-spike/stylo/stylo_atoms" }
stylo_derive = { path = "/mnt/data/servo-spike/stylo/style_derive" }
stylo_dom = { path = "/mnt/data/servo-spike/stylo/stylo_dom" }
stylo_malloc_size_of = { path = "/mnt/data/servo-spike/stylo/malloc_size_of" }
stylo_static_prefs = { path = "/mnt/data/servo-spike/stylo/stylo_static_prefs" }
stylo_traits = { path = "/mnt/data/servo-spike/stylo/style_traits" }
to_shmem = { path = "/mnt/data/servo-spike/stylo/to_shmem" }
to_shmem_derive = { path = "/mnt/data/servo-spike/stylo/to_shmem_derive" }
