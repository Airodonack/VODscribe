[workspace]
members = ["crates/core", "crates/player", "crates/worker", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.7.1"
edition = "2024"
publish = false

# See https://tauri.app/concept/size/#cargo-configuration
# The player's per-pixel work is far too slow unoptimised: in `tauri dev`
# a 1080p frame took 57 ms to draw and the picture fell half a second
# behind the sound (release: 4 ms). Optimised in dev builds too.
[profile.dev.package.vodscribe-player]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The release build with what a profiler needs to name our code: its
# symbols and line tables (frames by function and line; perf, in
# tests/e2e). Built by scripts/build-profiling.sh, which also turns on frame
# pointers. Never shipped.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# A copy of sherpa-onnx-sys that can link sherpa-onnx's builds without
# text-to-speech (and its GPL-3.0 espeak-ng); see third_party/README.md.
[patch.crates-io]
sherpa-onnx-sys = { path = "third_party/sherpa-onnx-sys" }
# Servo's layout reads scrollbar-width, scrollbar-color and scrollbar-gutter,
# which stylo 0.22.0 hides from Servo; branch vodscribe/v0.22.0 of the
# Airodonack/stylo fork exposes them. A [patch] only counts in the root
# workspace, so it is repeated here, for every crate of stylo's workspace (or
# two copies of the shared ones build).
selectors = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
servo_arc = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_atoms = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_derive = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_dom = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_malloc_size_of = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_static_prefs = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
stylo_traits = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
to_shmem = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
to_shmem_derive = { git = "https://github.com/Airodonack/stylo", rev = "b5c009c00c159d11d9c01f4c01957f4b2290b767" }
